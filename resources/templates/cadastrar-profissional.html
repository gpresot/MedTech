
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Profissional - MedTech</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/cadastrar-profissional.css}">

    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <h1>Cadastrar profissional</h1>
        <p>Preencha os dados para cadastrar um profissional no hospital.</p>

        <form id="formProfissional">

            <label for="tipo">Tipo de profissional</label>
            <select id="tipo" required>
                <option value="">Selecione</option>
                <option value="CLINICO">Médico clínico geral</option>
                <option value="ESPECIALISTA">Médico especialista</option>
                <option value="CIRURGIAO">Cirurgião</option>
            </select>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" maxlength="11"
                   placeholder="Somente números" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" maxlength="11"
                   placeholder="Somente números" required>

            <label for="crm">CRM</label>
            <input type="text" id="crm" required>

            <div id="campoEspecialidade" style="display: none;">
                <label for="especialidade">Especialidade</label>
                <select id="especialidade">
                    <option value="">Selecione uma especialidade</option>
                    <option value="CARDIOLOGIA">Cardiologia</option>
                    <option value="NEUROLOGIA">Neurologia</option>
                    <option value="ORTOPEDIA">Ortopedia</option>
                    <option value="DERMATOLOGIA">Dermatologia</option>
                    <option value="PEDIATRIA">Pediatria</option>
                    <option value="OFTALMOLOGIA">Oftalmologia</option>
                    <option value="PSIQUIATRIA">Psiquiatria</option>
                    <option value="ENDOCRINOLOGIA">Endocrinologia</option>
                    <option value="GINECOLOGIA">Ginecologia</option>
                    <option value="UROLOGIA">Urologia</option>
                </select>
            </div>

            <button type="submit">Cadastrar profissional</button>

            <p id="mensagem"></p>

        </form>
    </main>

    <script>
        const tipo = document.getElementById("tipo");
        const campoEspecialidade = document.getElementById("campoEspecialidade");
        const especialidade = document.getElementById("especialidade");
        const formulario = document.getElementById("formProfissional");
        const mensagem = document.getElementById("mensagem");

        tipo.addEventListener("change", function () {
            const especialista = tipo.value === "ESPECIALISTA";

            campoEspecialidade.style.display = especialista ? "block" : "none";
            especialidade.required = especialista;

            if (!especialista) {
                especialidade.value = "";
            }
        });

        formulario.addEventListener("submit", async function (event) {
            event.preventDefault();

            mensagem.textContent = "Cadastrando profissional...";

            const dados = {
                tipo: tipo.value,
                nome: document.getElementById("nome").value.trim(),
                cpf: document.getElementById("cpf").value.trim(),
                email: document.getElementById("email").value.trim(),
                telefone: document.getElementById("telefone").value.trim(),
                crm: document.getElementById("crm").value.trim(),
                especialidade: tipo.value === "ESPECIALISTA"
                    ? especialidade.value
                    : null
            };

            try {
                const resposta = await fetch("/profissionais", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                    const erro = await resposta.text();
                    throw new Error(erro || "Não foi possível cadastrar.");
                }

                mensagem.textContent = "Profissional cadastrado com sucesso!";

                formulario.reset();
                campoEspecialidade.style.display = "none";
                especialidade.required = false;

            } catch (erro) {
                mensagem.textContent = "Erro: " + erro.message;
            }
        });
    </script>

</body>
</html>
