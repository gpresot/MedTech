<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profissionais - MedTech</title>

    <!-- Estilos -->
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/profissionais.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">

        <header class="cabecalho">
            <h1>Profissionais</h1>
            <p>Gerenciamento de profissionais do hospital</p>
        </header>

        <section class="acoes">
            <a th:href="@{/profissionais/cadastrar}" class="botao">
                Cadastrar profissional
            </a>
        </section>

        <section class="lista-profissionais">

            <h2>Profissionais cadastrados</h2>

            <div th:if="${#lists.isEmpty(profissionais)}">
                <p>Nenhum profissional cadastrado.</p>
            </div>

            <div class="tabela-container" th:unless="${#lists.isEmpty(profissionais)}">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>CRM</th>
                            <th>Especialidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="profissional : ${profissionais}">

                            <td th:text="${profissional.id}"></td>
                            <td th:text="${profissional.nome}"></td>
                            <td th:text="${profissional.cpf}"></td>
                            <td th:text="${profissional.email}"></td>
                            <td th:text="${profissional.telefone}"></td>
                            <td th:text="${profissional.crm}"></td>

                            <td>
                                <span th:if="${profissional instanceof T(com.example.MedTech.model.MedicoEspecialista)}"
                                    th:text="${profissional.especialidade}">
                                </span>

                                <span
                                    th:unless="${profissional instanceof T(com.example.MedTech.model.MedicoEspecialista)}">
                                    Não se aplica
                                </span>
                            </td>

                            <td>
                                <a th:href="@{/profissionais/editar/{id}(id=${profissional.id})}" class="botao">
                                    Editar
                                </a>

                                <button type="button" class="botao-excluir" th:attr="data-id=${profissional.id}">
                                    Excluir
                                </button>
                            </td>

                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script>
        document.querySelectorAll(".botao-excluir").forEach(botao => {
            botao.addEventListener("click", async () => {
                const id = botao.getAttribute("data-id");

                const confirmar = confirm(
                    "Tem certeza de que deseja excluir este profissional?"
                );

                if (!confirmar) {
                    return;
                }

                try {
                    const resposta = await fetch(`/profissionais/${id}`, {
                        method: "DELETE"
                    });

                    if (resposta.ok) {
                        alert("Profissional excluído com sucesso!");
                        window.location.reload();
                    } else if (resposta.status === 404) {
                        alert("Profissional não encontrado.");
                    } else {
                        alert("Não foi possível excluir o profissional.");
                    }

                } catch (erro) {
                    alert("Erro ao conectar com o servidor.");
                    console.error(erro);
                }
            });
        });
    </script>

</body>

</html>
