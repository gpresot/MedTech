<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>
<div class="register-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/logo.png}" alt="Logo MedTech">
    </div>
    <div class="register-form">
        <form th:action="@{/register/paciente}" method="post" class="register-form">
            <h4 class="register-title">Registro de Paciente</h4>
            <div th:if="${registerError}" th:text="${registerError}" style="color:red;"></div>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="999.999.999-99" required>

            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="8" required>

            <div class="register-button-container">
                <button type="submit">Registrar</button>
            </div>
        </form>
        <p class="register-redirect-options">
            Já possui conta? <a th:href="@{/login}">Faça login</a>
        </p>
    </div>
</div>
</body>

</html>
