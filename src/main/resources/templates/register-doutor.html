<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Doutor - MedTech</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="register-container">
        <div class="register-image-logo-container">
            <img th:src="@{/images/logo.png}" alt="Logo MedTech">
        </div>
        <div class="register-form-area">
            <form th:action="@{/register/doutor}" method="post" class="register-form">
                <h4 class="register-title">Registro de Doutor</h4>
                <div th:if="${registerError}" th:text="${registerError}" style="color:red;"></div>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>

                <label for="especialidade">Especialidade</label>

                <select id="especialidade" name="especialidade" required>
                    <option value="" disabled selected>Selecione sua especialidade</option>
                    <option value="CARDIOLOGIA">Cardiologia</option>
                    <option value="NEUROLOGIA">Neurologia</option>
                    <option value="ORTOPEDIA">Ortopedia</option>
                    <option value="DERMATOLOGIA">Dermatologia</option>
                    <option value="PEDIATRIA">Pediatria</option>
                    <option value="OFTALMOLOGIA">Oftalmologia</option>
                    <option value="PSIQUIATRIA">Psiquiatria</option>
                    <option value="ENDOCRINOLOGIA">Endocrinologia</option>
                    <option value="GINECOLOGIA">Ginecologia</option>
                    <option value="UROLOGIA">Urologia</option>
                </select>

                <label for="registroProfissional">Registro profissional (CRM)</label>
                <input type="text" id="registroProfissional" name="registroProfissional" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>


                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="Somente números" inputmode="numeric" maxlength="11"
                    pattern="[0-9]{11}" title="Informe os 11 números do CPF" required />


                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="8" required>

                <div class="register-button-container">
                    <button type="submit">Registrar</button>
                </div>
            </form>
            <p class="register-redirect-options">
                Já possui conta? <a th:href="@{/login}">Faça login</a>
            </p>
        </div>
    </div>
</body>

</html>
