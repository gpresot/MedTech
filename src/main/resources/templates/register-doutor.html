<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Doutor - MedTech</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="icon" type="image/png" th:href="@{/images/icon.png}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="register-container">
        <div class="register-image-logo-container">
            <img th:src="@{/images/logo.png}" alt="Logo MedTech">
        </div>
        <div class="register-form-area">
            <form th:action="@{/register/doutor}" method="post" class="register-form">
                <h4 class="register-title">Registro de Doutor</h4>
                <div th:if="${registerError}" th:text="${registerError}" style="color:red;"></div>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" th:value="${dadosForm?.get('nome')}" required>

                <label for="especialidade">Especialidade</label>

                <select id="especialidade" name="especialidade" required>
                    <option value="" disabled th:selected="${dadosForm == null}">Selecione sua especialidade</option>
                    <option th:each="e : ${especialidades}"
                            th:value="${e.name()}"
                            th:text="${@rotulos.de(e)}"
                            th:selected="${dadosForm != null and e.name() == dadosForm.get('especialidade')}"></option>
                </select>

                <label for="registroProfissional">Registro profissional (CRM)</label>
                <input type="text" id="registroProfissional" name="registroProfissional" th:value="${dadosForm?.get('registroProfissional')}" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(31) 99999-9999" th:value="${dadosForm?.get('telefone')}" required>


                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="999.999.999-99" maxlength="14"
                    th:value="${dadosForm?.get('cpf')}" required />


                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" th:value="${dadosForm?.get('email')}" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="8" required>

                <th:block th:if="${exigeConvite}">
                    <label for="codigoConvite">Código de convite</label>
                    <input type="password" id="codigoConvite" name="codigoConvite" autocomplete="off" required>
                </th:block>

                <div class="register-button-container">
                    <button type="submit">Registrar</button>
                </div>
            </form>
            <p class="register-redirect-options">
                Já possui conta? <a th:href="@{/login}">Faça login</a>
            </p>
        </div>
    </div>
</body>

</html>
