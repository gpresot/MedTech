<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>

    <header th:fragment="navbar" class="navbar-medtech">

        <div class="navbar-container">

            <!-- LOGO -->
            <a th:href="@{/home}" class="navbar-logo">
                <img th:src="@{/images/logo.png}" alt="MedTech">
            </a>

            <!-- NAVEGAÇÃO -->
            <nav class="navbar-links">

                <a th:href="@{/home}" th:classappend="${paginaAtual == 'home'} ? ' ativo' : ''">
                    Início
                </a>

                <!-- Só profissionais veem as páginas de gestão -->
                <th:block th:if="${logado == true and ehPaciente != true}">

                    <a th:href="@{/profissionais/pagina}"
                        th:classappend="${paginaAtual == 'profissionais'} ? ' ativo' : ''">
                        Profissionais
                    </a>

                    <a th:href="@{/pacientes/pagina}"
                        th:classappend="${paginaAtual == 'pacientes'} ? ' ativo' : ''">
                        Pacientes
                    </a>

                    <a th:href="@{/consultas/pagina}"
                        th:classappend="${paginaAtual == 'consultas'} ? ' ativo' : ''">
                        Consultas
                    </a>

                    <a th:href="@{/internacoes/pagina}"
                        th:classappend="${paginaAtual == 'internacoes'} ? ' ativo' : ''">
                        Internações
                    </a>

                    <a th:href="@{/procedimentos/pagina}"
                        th:classappend="${paginaAtual == 'procedimentos'} ? ' ativo' : ''">
                        Cirurgias
                    </a>

                    <a th:href="@{/quartos/pagina}"
                        th:classappend="${paginaAtual == 'quartos'} ? ' ativo' : ''">
                        Quartos
                    </a>

                </th:block>

                <a th:if="${logado == true}" th:href="@{${perfilUrl}}"
                    th:classappend="${paginaAtual == 'perfil'} ? ' ativo' : ''">
                    Meu perfil
                </a>

            </nav>

            <!-- SAIR (logado) / ENTRAR (visitante) -->
            <form th:if="${logado == true}" th:action="@{/logout}" method="post" class="navbar-logout">
                <button type="submit">
                    Sair
                </button>
            </form>

            <div th:unless="${logado == true}" class="navbar-logout">
                <a th:href="@{/login}" class="navbar-entrar">
                    Entrar
                </a>
            </div>

        </div>

    </header>

</body>

</html>
