
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Profissional - MedTech</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/editar-profissional.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">

        <header class="cabecalho">
            <h1>Editar profissional</h1>
            <p>Altere os dados do profissional cadastrado.</p>
        </header>

        <form id="formEditarProfissional">

            <input type="hidden" id="id"
                   th:value="${profissional.id}">

            <label for="nome">Nome completo</label>
            <input type="text" id="nome"
                   th:value="${profissional.nome}" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf"
                   th:value="${profissional.cpf}"
                   maxlength="11" required>

            <label for="email">E-mail</label>
            <input type="email" id="email"
                   th:value="${profissional.email}" required>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone"
                   th:value="${profissional.telefone}"
                   maxlength="11" required>

            <label for="crm">CRM</label>
            <input type="text" id="crm"
                   th:value="${profissional.crm}" required>

            <div th:if="${profissional instanceof T(com.example.MedTech.model.MedicoEspecialista)}">

                <label for="especialidade">Especialidade</label>

                <select id="especialidade">
                    <option value="CARDIOLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'CARDIOLOGIA'}">
                        Cardiologia
                    </option>
                    <option value="NEUROLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'NEUROLOGIA'}">
                        Neurologia
                    </option>
                    <option value="ORTOPEDIA"
                        th:selected="${profissional.especialidade?.name() == 'ORTOPEDIA'}">
                        Ortopedia
                    </option>
                    <option value="DERMATOLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'DERMATOLOGIA'}">
                        Dermatologia
                    </option>
                    <option value="PEDIATRIA"
                        th:selected="${profissional.especialidade?.name() == 'PEDIATRIA'}">
                        Pediatria
                    </option>
                    <option value="OFTALMOLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'OFTALMOLOGIA'}">
                        Oftalmologia
                    </option>
                    <option value="PSIQUIATRIA"
                        th:selected="${profissional.especialidade?.name() == 'PSIQUIATRIA'}">
                        Psiquiatria
                    </option>
                    <option value="ENDOCRINOLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'ENDOCRINOLOGIA'}">
                        Endocrinologia
                    </option>
                    <option value="GINECOLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'GINECOLOGIA'}">
                        Ginecologia
                    </option>
                    <option value="UROLOGIA"
                        th:selected="${profissional.especialidade?.name() == 'UROLOGIA'}">
                        Urologia
                    </option>
                </select>

            </div>

            <button type="submit">Salvar alterações</button>

            <p id="mensagem"></p>

        </form>

    </main>

    <script>
        const formulario = document.getElementById("formEditarProfissional");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const id = document.getElementById("id").value;

            const dados = {
                nome: document.getElementById("nome").value.trim(),
                cpf: document.getElementById("cpf").value.trim(),
                email: document.getElementById("email").value.trim(),
                telefone: document.getElementById("telefone").value.trim(),
                crm: document.getElementById("crm").value.trim()
            };

            const campoEspecialidade = document.getElementById("especialidade");

            if (campoEspecialidade) {
                dados.especialidade = campoEspecialidade.value;
            }

            mensagem.textContent = "Salvando alterações...";

            try {

                const resposta = await fetch(`/profissionais/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                    const erro = await resposta.text();
                    throw new Error(erro || "Não foi possível atualizar.");
                }

                mensagem.textContent = "Profissional atualizado com sucesso!";

                setTimeout(() => {
                    window.location.href = "/profissionais/pagina";
                }, 1000);

            } catch (erro) {

                mensagem.textContent = "Erro: " + erro.message;

            }

        });
    </script>

</body>
</html>
