<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perfil do Doutor - MedTech</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/perfil.css}" />
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="perfil-header">

        <div class="perfil-logo">
            <img th:src="@{/images/logo.png}" alt="Logo MedTech Minas" />
        </div>

        <nav class="perfil-nav">
            <a href="/">Início</a>
            <a href="/login">Sair</a>
        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="perfil-container">

        <h1 class="perfil-title">
            Perfil do Profissional
        </h1>


        <!-- IDENTIFICAÇÃO DO PROFISSIONAL -->

        <section class="perfil-identificacao">

            <div class="perfil-foto">
                <span>👨‍⚕️</span>
            </div>

            <div class="perfil-nome">

                <h2 th:text="${profissional.nome}">
                    Nome do profissional
                </h2>

                <p th:text="${profissional.especialidade}">
                    Especialidade
                </p>

            </div>

        </section>


        <!-- INFORMAÇÕES PROFISSIONAIS -->

        <section class="perfil-card">

            <h2>
                Informações profissionais
            </h2>

            <div class="perfil-info-grid">

                <!-- NOME -->

                <div class="perfil-info">

                    <span>Nome</span>

                    <strong th:text="${profissional.nome}">
                        Nome do profissional
                    </strong>

                </div>


                <!-- REGISTRO -->

                <div class="perfil-info">

                    <span>Registro profissional</span>

                    <strong th:text="${profissional.registroProfissional}">
                        Registro profissional
                    </strong>

                </div>


                <!-- ESPECIALIDADE -->

                <div class="perfil-info">

                    <span>Especialidade</span>

                    <strong th:text="${profissional.especialidade}">
                        Especialidade
                    </strong>

                </div>


                <!-- TELEFONE -->

                <div class="perfil-info">

                    <span>Telefone</span>

                    <strong th:text="${profissional.telefone}">
                        Telefone do profissional
                    </strong>

                </div>


                <!-- E-MAIL -->

                <div class="perfil-info">

                    <span>E-mail</span>

                    <strong th:text="${profissional.email}">
                        E-mail do profissional
                    </strong>

                </div>

            </div>

        </section>


        <!-- AÇÕES -->

        <section class="perfil-acoes">

            <button type="button" class="perfil-button perfil-button-primary">
                Editar perfil
            </button>

            <button type="button" class="perfil-button">
                Ver consultas
            </button>

        </section>

    </main>

</body>

</html>
